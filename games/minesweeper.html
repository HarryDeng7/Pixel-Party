<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Pixel Minesweeper &#x2014; clear the field without touching a single mine.">
<title>Pixel Minesweeper &#x2014; Pixel Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230a0618'/><rect x='2' y='2' width='12' height='12' fill='%23f06595'/></svg>">
<link rel="stylesheet" href="../style.css">
<style>
  .stage-wrap { max-width: 360px; margin: 0 auto; }
</style>
</head>
<body>
<div class="shell">

  <div class="top-bar">
    <a class="exit-arrow" href="../index.html" title="Back to all games">&#x2190;</a>
    <h1 class="game-title">PIXEL MINESWEEPER</h1>
    <button class="mute-btn" id="muteBtn">SOUND: ON</button>
  </div>

  <div class="stage-wrap">
    <canvas id="game" width="360" height="400"></canvas>

    <div id="startOverlay" class="overlay">
      <h2>PIXEL MINESWEEPER</h2>
      <p class="ov-sub">&#x600E;&#x4E48;&#x73A9;&#xFF1A;&#x5DE6;&#x952E;&#x7FFB;&#x5F00;&#x683C;&#x5B50; &#x00B7; &#x53F3;&#x952E;&#x63D2;&#x65D7;</p>
      <button class="btn" id="startBtn">START</button>
      <p class="ov-sub" style="font-size:11px">&#x600E;&#x4E48;&#x8D62;&#xFF1A;&#x6392;&#x9664;&#x6240;&#x6709;&#x5730;&#x96F7;&#xFF0C;&#x522B;&#x8E29;&#x5230;&#x70B8;&#x5F39;</p>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
      <h2>PAUSED</h2>
      <p class="ov-sub">press P to resume</p>
    </div>

    <div id="overOverlay" class="overlay hidden">
      <h2 id="endTitle">GAME OVER</h2>
      <p class="ov-sub" id="finalScore">TIME 0s &#x00B7; BEST -</p>
      <button class="btn" id="restartBtn">PLAY AGAIN</button>
      <p class="ov-sub" style="font-size:11px">or press ENTER</p>
    </div>
  </div>

  <p class="controls-hint">LEFT CLICK REVEAL &#x00B7; RIGHT CLICK FLAG &#x00B7; P PAUSE &#x00B7; M SOUND</p>
</div>

<script>/* ============================================================
   PIXEL MINESWEEPER - 9x9, 10 mines (vanilla canvas)
   ============================================================ */
(function () {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const COLS = 9, ROWS = 9, MINES = 10, CELL = 36;
  const OX = 18, OY = 48;
  const NUM_COLORS = ['#4de3ff', '#39ff14', '#ff4d6d', '#b96bff', '#ffb03d', '#f06595', '#fff', '#8f8fcf'];

  /* ---------------- audio (tiny WebAudio synth) ---------------- */
  let actx = null, muted = false;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(f0, f1, dur, type, vol, delay) {
    if (muted) return;
    const ac = ensureAudio(); if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(vol || 0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const sfx = {
    dig:    () => tone(240, 300, 0.05, 'square', 0.05),
    flag:   () => tone(180, 220, 0.05, 'triangle', 0.07),
    boom:   () => { tone(200, 40, 0.4, 'sawtooth', 0.16); tone(100, 30, 0.35, 'square', 0.1, 0.04); },
    win:    () => [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.14, 'square', 0.1, i * 0.14)),
    lose:   () => [400, 300, 200, 140].forEach((f, i) => tone(f, f, 0.16, 'sawtooth', 0.09, i * 0.16))
  };

  /* ---------------- state ---------------- */
  let grid, revCount, flags, time, started2, over, won, t = 0, last, started, paused;
  let best = Number(localStorage.getItem('pixel-game-mines-best') || 0);

  function idx(x, y) { return y * COLS + x; }

  function build(fx, fy) {
    grid = [];
    for (let i = 0; i < COLS * ROWS; i++) grid.push({ mine: false, n: 0, rev: false, flag: false });
    // place mines away from the first click
    let placed = 0;
    while (placed < MINES) {
      const x = Math.floor(Math.random() * COLS);
      const y = Math.floor(Math.random() * ROWS);
      if (Math.abs(x - fx) <= 1 && Math.abs(y - fy) <= 1) continue;
      const c = grid[idx(x, y)];
      if (c.mine) continue;
      c.mine = true;
      placed++;
    }
    // neighbor counts
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (grid[idx(x, y)].mine) continue;
        let n = 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const nx = x + dx, ny = y + dy;
            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && grid[idx(nx, ny)].mine) n++;
          }
        }
        grid[idx(x, y)].n = n;
      }
    }
    revCount = 0; flags = 0; time = 0; started2 = false; over = false; won = false;
  }

  function reveal(x, y) {
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
    const c = grid[idx(x, y)];
    if (c.rev || c.flag) return;
    c.rev = true;
    revCount++;
    if (c.mine) { lose(x, y); return; }
    sfx.dig();
    if (c.n === 0) {
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dy === 0) continue;
        reveal(x + dx, y + dy);
      }
    }
    if (!over && revCount === COLS * ROWS - MINES) win();
  }

  function win() {
    over = true; won = true;
    if (!best || time < best) {
      best = time;
      localStorage.setItem('pixel-game-mines-best', String(best));
    }
    document.getElementById('endTitle').textContent = 'YOU WIN!';
    document.getElementById('finalScore').textContent = 'TIME ' + time + 's  BEST ' + (best || '-') + 's';
    document.getElementById('overOverlay').classList.remove('hidden');
    sfx.win();
  }

  function lose(x, y) {
    over = true; won = false;
    grid[idx(x, y)].rev = true;
    for (let i = 0; i < grid.length; i++) if (grid[i].mine) grid[i].rev = true;
    document.getElementById('endTitle').textContent = 'GAME OVER';
    document.getElementById('finalScore').textContent = 'TIME ' + time + 's  BEST ' + (best || '-') + 's';
    document.getElementById('overOverlay').classList.remove('hidden');
    sfx.lose();
  }

  function init() { build(4, 4); }

  function update(dt) {
    if (started2 && !over) time += dt;
  }

  /* ---------------- input ---------------- */
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('mousedown', (e) => {
    if (!started || paused || over) return;
    const r = canvas.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (W / r.width) - OX;
    const x = Math.floor(mx / CELL);
    const y = Math.floor(((e.clientY - r.top) * (H / r.height) - OY) / CELL);
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
    if (e.button === 2) {
      const c = grid[idx(x, y)];
      if (!c.rev) {
        c.flag = !c.flag;
        flags += c.flag ? 1 : -1;
        sfx.flag();
      }
    } else if (e.button === 0) {
      if (!started2) { build(x, y); started2 = true; }
      reveal(x, y);
    }
  });

  const keys = {};
  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (e.repeat) return;
    keys[k] = true;
    if (k === 'p') togglePause();
    if (k === 'm') toggleMute();
    if (k === 'enter' && !started) startGame();
    if (k === 'enter' && over) rematch();
  });
  document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  function toggleMute() {
    muted = !muted;
    document.getElementById('muteBtn').textContent = muted ? 'SOUND: OFF' : 'SOUND: ON';
  }
  function togglePause() {
    if (!started || over) return;
    paused = !paused;
    document.getElementById('pauseOverlay').classList.toggle('hidden', !paused);
  }
  function startGame() {
    if (started) return;
    started = true;
    init();
    document.getElementById('startOverlay').classList.add('hidden');
  }
  function rematch() {
    document.getElementById('overOverlay').classList.add('hidden');
    init();
    started = true;
  }
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', rematch);
  document.getElementById('muteBtn').addEventListener('click', toggleMute);  /* ---------------- drawing ---------------- */
  function draw() {
    ctx.fillStyle = '#0a0618';
    ctx.fillRect(0, 0, W, H);
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const c = grid[idx(x, y)];
        const px = OX + x * CELL, py = OY + y * CELL;
        ctx.fillStyle = c.rev ? '#241538' : '#3b2b5e';
        ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
        if (c.rev && c.mine) {
          ctx.fillStyle = '#ff4d6d';
          ctx.fillRect(px + 11, py + 11, CELL - 22, CELL - 22);
          ctx.fillStyle = '#0a0618';
          ctx.fillRect(px + 15, py + 20, 3, 3);
          ctx.fillRect(px + 22, py + 20, 3, 3);
        } else if (c.rev && c.n > 0) {
          ctx.fillStyle = NUM_COLORS[c.n - 1];
          ctx.font = '800 18px "Courier New", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(c.n), px + CELL / 2, py + CELL / 2 + 1);
          ctx.textBaseline = 'alphabetic';
        } else if (c.flag) {
          ctx.fillStyle = '#ff4d6d';
          ctx.fillRect(px + 8, py + 8, 5, CELL - 16);
          ctx.fillRect(px + 8, py + 8, CELL - 16, 6);
          ctx.fillStyle = '#0a0618';
          ctx.fillRect(px + 11, py + 10, 5, 5);
        }
      }
    }
    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = '800 15px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('FLAGS ' + flags, 8, 26);
    ctx.textAlign = 'center';
    ctx.fillText(Math.floor(time) + 's', W / 2, 26);
    ctx.textAlign = 'right';
    ctx.fillText('BEST ' + (best || '-'), W - 8, 26);
    if (won) {
      ctx.fillStyle = 'rgba(10,6,24,0.75)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#39ff14';
      ctx.font = '800 26px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('FIELD CLEARED!', W / 2, H / 2);
    }
  }

  /* ---------------- main loop ---------------- */
  function loop(now) {
    if (typeof now !== 'number' || !isFinite(now)) now = performance.now();
    if (typeof last !== 'number' || !isFinite(last)) last = now;
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    t += dt;
    if (started && !paused && !over) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  init();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
