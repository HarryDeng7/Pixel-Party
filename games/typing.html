<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Pixel Typing &#x2014; type the falling words before they hit the ground.">
<title>Pixel Typing &#x2014; Pixel Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230a0618'/><rect x='2' y='2' width='12' height='12' fill='%2354a0ff'/></svg>">
<link rel="stylesheet" href="../style.css">
<style>
  .stage-wrap { max-width: 480px; margin: 0 auto; }
</style>
</head>
<body>
<div class="shell">

  <div class="top-bar">
    <a class="exit-arrow" href="../index.html" title="Back to all games">&#x2190;</a>
    <h1 class="game-title">PIXEL TYPING</h1>
    <button class="mute-btn" id="muteBtn">SOUND: ON</button>
  </div>

  <div class="stage-wrap">
    <canvas id="game" width="480" height="360"></canvas>

    <div id="startOverlay" class="overlay">
      <h2>PIXEL TYPING</h2>
      <p class="ov-sub">HOW TO PLAY: TYPE THE FALLING WORDS' LETTERS TO DESTROY THEM</p>
      <button class="btn" id="startBtn">START</button>
      <p class="ov-sub" style="font-size:11px">HOW TO WIN: DON'T LET WORDS HIT THE GROUND - FIRST TO 100</p>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
      <h2>PAUSED</h2>
      <p class="ov-sub">press P to resume</p>
    </div>

    <div id="overOverlay" class="overlay hidden">
      <h2 id="endTitle">GAME OVER</h2>
      <p class="ov-sub" id="finalScore">SCORE 0 &#x00B7; BEST 0</p>
      <button class="btn" id="restartBtn">PLAY AGAIN</button>
      <p class="ov-sub" style="font-size:11px">or press ENTER</p>
    </div>
  </div>

  <p class="controls-hint">TYPE THE FALLING WORDS &#x00B7; P PAUSE &#x00B7; M SOUND</p>
</div>

<script src="../points.js"></script>
<script>/* ============================================================
   PIXEL TYPING - clear falling words, first to 100 (vanilla)
   ============================================================ */
(function () {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const TARGET = 100, GROUND = H - 42;

  const WORDS = ['THE', 'CAT', 'RUN', 'STAR', 'GAME', 'PIXEL', 'JUMP', 'CODE', 'FAST', 'COOL',
                 'NINJA', 'BALL', 'FIRE', 'MOVE', 'ZOOM', 'JAZZ', 'KITE', 'LUCK', 'MATH', 'PLAY'];

  /* ---------------- audio (tiny WebAudio synth) ---------------- */
  let actx = null, muted = false;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(f0, f1, dur, type, vol, delay) {
    if (muted) return;
    const ac = ensureAudio(); if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(vol || 0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const sfx = {
    type: () => tone(500, 560, 0.04, 'square', 0.05),
    done: () => { tone(440, 660, 0.1, 'square', 0.09); tone(660, 880, 0.1, 'square', 0.08, 0.07); },
    miss: () => tone(180, 120, 0.14, 'sawtooth', 0.08),
    win:  () => [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.14, 'square', 0.1, i * 0.14)),
    lose: () => [400, 300, 200, 140].forEach((f, i) => tone(f, f, 0.16, 'sawtooth', 0.09, i * 0.16))
  };

  /* ---------------- state ---------------- */
  let words, lives, score, time2, spawnT, over, t = 0, last, started, paused;
  let best = Number(localStorage.getItem('pixel-game-typing-best') || 0);

  function init() {
    words = [];
    lives = 3; score = 0; time2 = 0; spawnT = 1.2; over = false;
  }

  function endGame(won) {
    over = true; window.PGPoints && PGPoints.afterGame();
    if (score > best) { best = score; localStorage.setItem('pixel-game-typing-best', String(best)); }
    document.getElementById('endTitle').textContent = won ? 'YOU WIN!' : 'GAME OVER';
    document.getElementById('finalScore').textContent = 'SCORE ' + score + '  BEST ' + best;
    document.getElementById('overOverlay').classList.remove('hidden');
    if (won) sfx.win(); else sfx.lose();
  }

  /* ---------------- input ---------------- */
  const keys = {};
  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (e.repeat) return;
    keys[k] = true;
    if (k === 'p') togglePause();
    if (k === 'm') toggleMute();
    if (k === 'enter' && !started) startGame();
    if (k === 'enter' && over) rematch();
    // typing
    if (started && !paused && !over && k.length === 1 && k >= 'a' && k <= 'z') {
      const ch = k.toUpperCase();
      let pick = null;
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        if (w.text[w.idx] === ch && (!pick || w.y > pick.y)) pick = w;
      }
      if (pick) {
        pick.idx++;
        sfx.type();
        if (pick.idx >= pick.text.length) {
          score += 10 + pick.text.length;
          words.splice(words.indexOf(pick), 1);
          sfx.done();
          if (score >= TARGET) { endGame(true); return; }
        }
      }
    }
  });
  document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  function toggleMute() {
    muted = !muted;
    document.getElementById('muteBtn').textContent = muted ? 'SOUND: OFF' : 'SOUND: ON';
  }
  function togglePause() {
    if (!started || over) return;
    paused = !paused;
    document.getElementById('pauseOverlay').classList.toggle('hidden', !paused);
  }
  function startGame() {
    if (started) return;
    started = true;
    init();
    document.getElementById('startOverlay').classList.add('hidden');
  }
  function rematch() {
    document.getElementById('overOverlay').classList.add('hidden');
    init();
    started = true;
  }
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', rematch);
  document.getElementById('muteBtn').addEventListener('click', toggleMute);

  /* ---------------- update ---------------- */
  function update(dt) {
    time2 += dt;
    spawnT -= dt;
    if (spawnT <= 0 && words.length < 8) {
      spawnT = Math.max(1.1, 2.2 - time2 * 0.02);
      const txt = WORDS[Math.floor(Math.random() * WORDS.length)];
      const fw = ctx.measureText(txt).width;
      words.push({ text: txt, x: 20 + Math.random() * (W - fw - 40), y: -30, idx: 0 });
    }
    const spd = 40 + time2 * 1.2;
    for (let i = words.length - 1; i >= 0; i--) {
      const w = words[i];
      w.y += spd * dt;
      if (w.y > GROUND) {
        words.splice(i, 1);
        lives--;
        sfx.miss();
        if (lives <= 0) { endGame(false); return; }
      }
    }
  }  /* ---------------- drawing ---------------- */
  function draw() {
    ctx.fillStyle = '#0a0618';
    ctx.fillRect(0, 0, W, H);
    // ground line
    ctx.fillStyle = '#ff4d6d';
    ctx.fillRect(0, GROUND, W, 3);
    ctx.font = '800 20px "Courier New", monospace';
    ctx.textBaseline = 'alphabetic';
    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      ctx.textAlign = 'left';
      // completed part in green, rest in white, target letter boxed
      const done = w.text.slice(0, w.idx);
      const rest = w.text.slice(w.idx);
      ctx.fillStyle = '#39ff14';
      ctx.fillText(done, w.x, w.y);
      const dw = ctx.measureText(done).width;
      ctx.fillStyle = '#fff';
      ctx.fillText(rest, w.x + dw, w.y);
      if (rest.length) {
        const tw = ctx.measureText(rest[0]).width;
        ctx.strokeStyle = '#54a0ff';
        ctx.strokeRect(w.x + dw - 1, w.y - 17, tw + 2, 22);
      }
    }
    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = '800 15px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + score + '/' + TARGET, 8, 24);
    ctx.textAlign = 'right';
    ctx.fillText('BEST ' + best, W - 8, 24);
    for (let i = 0; i < lives; i++) {
      ctx.fillStyle = '#ff4d6d';
      ctx.fillRect(8 + i * 20, H - 22, 14, 12);
      ctx.fillRect(8 + i * 20 + 4, H - 26, 6, 6);
    }
  }

  /* ---------------- main loop ---------------- */
  function loop(now) {
    if (typeof now !== 'number' || !isFinite(now)) now = performance.now();
    if (typeof last !== 'number' || !isFinite(last)) last = now;
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    t += dt;
    if (started && !paused && !over) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  init();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
