<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Pixel Snake — the classic grid game. Eat, grow, don't bite your tail.">
<title>Pixel Snake — Pixel Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230a0618'/><rect x='2' y='2' width='12' height='12' fill='%2339ff14'/></svg>">
<link rel="stylesheet" href="../style.css">
<style>
  .stage-wrap { max-width: 480px; margin: 0 auto; }
</style>
</head>
<body>
<div class="shell">

  <div class="top-bar">
    <a class="exit-arrow" href="../index.html" title="Back to all games">←</a>
    <h1 class="game-title">PIXEL SNAKE</h1>
    <button class="mute-btn" id="muteBtn">SOUND: ON</button>
  </div>

  <div class="stage-wrap">
    <canvas id="game" width="420" height="420"></canvas>

    <div id="startOverlay" class="overlay">
      <h2>PIXEL SNAKE</h2>
      <p class="ov-sub">&#x600E;&#x4E48;&#x73A9;&#xFF1A;&#x65B9;&#x5411;&#x952E; / WASD &#x8F6C;&#x5411;&#xFF0C;&#x5403;&#x82F9;&#x679C;</p>
      <button class="btn" id="startBtn">START</button>
      <p class="ov-sub" style="font-size:11px">&#x600E;&#x4E48;&#x8D62;&#xFF1A;&#x4E0D;&#x649E;&#x5899;&#x3001;&#x4E0D;&#x54AC;&#x81EA;&#x5DF1;&#xFF0C;&#x5206;&#x6570;&#x8D8A;&#x9AD8;&#x8D8A;&#x597D;</p>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
      <h2>PAUSED</h2>
      <p class="ov-sub">press P to resume</p>
    </div>

    <div id="overOverlay" class="overlay hidden">
      <h2>GAME OVER</h2>
      <p class="ov-sub" id="finalScore">SCORE 0 · BEST 0</p>
      <button class="btn" id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>

  <p class="controls-hint">ARROWS / WASD STEER · P PAUSE · M SOUND · EAT = +10, FASTER EVERY 50 PTS</p>
</div>

<script>
/* ============================================================
   PIXEL SNAKE — classic grid game (vanilla canvas)
   ============================================================ */
(function () {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const COLS = 21, ROWS = 21, CELL = 20;

  /* ---------------- audio ---------------- */
  let actx = null, muted = false;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(f0, f1, dur, type, vol, delay) {
    if (muted) return;
    const ac = ensureAudio(); if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(vol || 0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const sfx = {
    eat:  () => { tone(520, 660, 0.07, 'square', 0.08); tone(780, 900, 0.07, 'square', 0.06, 0.06); },
    over: () => { tone(300, 90, 0.4, 'sawtooth', 0.15); tone(150, 60, 0.4, 'square', 0.1, 0.1); }
  };

  /* ---------------- state ---------------- */
  let snake, dir, queue, food, score, best, acc, tickMs, running, paused, particles, newRecord;
  let t = 0;

  function loadBest() {
    try { best = parseInt(localStorage.getItem('pixel-game-snake-best') || '0', 10) || 0; }
    catch (e) { best = 0; }
  }
  function saveBest() { try { localStorage.setItem('pixel-game-snake-best', String(best)); } catch (e) {} }

  function spawnFood() {
    do {
      food = { x: (Math.random() * COLS) | 0, y: (Math.random() * ROWS) | 0 };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    acc = 0;
    tickMs = 140;
    particles = [];
    newRecord = false;
    spawnFood();
  }

  function startGame() {
    reset();
    running = true; paused = false;
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('overOverlay').classList.add('hidden');
    document.getElementById('pauseOverlay').classList.add('hidden');
  }

  function gameOver() {
    running = false;
    if (score > best) { best = score; saveBest(); newRecord = true; }
    sfx.over();
    document.getElementById('finalScore').textContent =
      'SCORE ' + score + ' · BEST ' + best + (newRecord ? ' — NEW RECORD!' : '');
    document.getElementById('overOverlay').classList.remove('hidden');
  }

  /* ---------------- input ---------------- */
  const DIRS = {
    arrowup: { x: 0, y: -1 }, w: { x: 0, y: -1 },
    arrowdown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
    arrowleft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
    arrowright: { x: 1, y: 0 }, d: { x: 1, y: 0 }
  };

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
    if (k === 'p') {
      if (!running) return;
      paused = !paused;
      document.getElementById('pauseOverlay').classList.toggle('hidden', !paused);
      return;
    }
    if (k === 'm') { toggleMute(); return; }
    if (k === 'enter' && !running) { startGame(); return; }
    const d = DIRS[k];
    if (d && running && !paused) {
      const last = queue.length ? queue[queue.length - 1] : dir;
      if (d.x !== -last.x || d.y !== -last.y) {
        if (queue.length < 3) queue.push(d);
      }
    }
  });

  function toggleMute() {
    muted = !muted;
    document.getElementById('muteBtn').textContent = muted ? 'SOUND: OFF' : 'SOUND: ON';
  }
  document.getElementById('muteBtn').addEventListener('click', toggleMute);
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  /* ---------------- logic ---------------- */
  function tick() {
    if (queue.length) dir = queue.shift();
    const head = snake[0];
    const nx = head.x + dir.x, ny = head.y + dir.y;

    // wall or self collision
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || snake.some(s => s.x === nx && s.y === ny)) {
      gameOver();
      return;
    }
    snake.unshift({ x: nx, y: ny });
    if (nx === food.x && ny === food.y) {
      score += 10;
      if (score > best) { best = score; saveBest(); }
      sfx.eat();
      // munch particles
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: food.x * CELL + CELL / 2, y: food.y * CELL + CELL / 2,
          vx: (Math.random() - 0.5) * 160, vy: (Math.random() - 0.5) * 160,
          life: 0.4, color: i % 2 ? '#ff2d2d' : '#ffe94a'
        });
      }
      tickMs = Math.max(65, 140 - Math.floor(score / 50) * 8);
      spawnFood();
    } else {
      snake.pop();
    }
  }

  /* ---------------- rendering ---------------- */
  function draw() {
    t += 1;
    ctx.fillStyle = '#0d0620';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // checkerboard
    ctx.fillStyle = 'rgba(255,255,255,0.045)';
    for (let i = 0; i < COLS; i++) for (let j = 0; j < ROWS; j++) {
      if ((i + j) % 2 === 0) ctx.fillRect(i * CELL, j * CELL, CELL, CELL);
    }

    // food (pixel apple with pulse)
    const pulse = 1 + Math.sin(t * 0.3) * 0.12;
    const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
    ctx.fillStyle = '#7a0f0f';
    ctx.fillRect(fx - 7 * pulse, fy - 7 * pulse, 14 * pulse, 14 * pulse);
    ctx.fillStyle = '#ff2d2d';
    ctx.fillRect(fx - 6 * pulse, fy - 6 * pulse, 12 * pulse, 12 * pulse);
    ctx.fillStyle = '#39ff14';
    ctx.fillRect(fx - 2 * pulse, fy - 8 * pulse, 4 * pulse, 5 * pulse);
    ctx.fillStyle = '#ffb3b3';
    ctx.fillRect(fx - 5 * pulse, fy - 4 * pulse, 3 * pulse, 3 * pulse);

    // snake
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const shade = i === 0 ? 1 : 0.55 + 0.45 * (1 - i / snake.length);
      ctx.fillStyle = i === 0 ? '#b6ffa0' : 'rgb(' + Math.round(57 * shade) + ',' + Math.round(255 * shade * 0.92) + ',' + Math.round(20 * shade) + ')';
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + CELL - 5, CELL - 2, 3);
      if (i === 0) {
        // eyes
        ctx.fillStyle = '#0a0618';
        const ex = s.x * CELL + CELL / 2, ey = s.y * CELL + CELL / 2;
        const px = dir.x * 3, py = dir.y * 3;
        ctx.fillRect(ex - 5 + px, ey - 4 + py, 3, 4);
        ctx.fillRect(ex + 2 + px, ey - 4 + py, 3, 4);
        ctx.fillStyle = '#fff';
        ctx.fillRect(ex - 4 + px, ey - 3 + py, 1, 2);
        ctx.fillRect(ex + 3 + px, ey - 3 + py, 1, 2);
      }
    }

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= 0.02;
      p.x += p.vx * 0.02; p.y += p.vy * 0.02;
      p.vx *= 0.9; p.vy *= 0.9;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // score
    ctx.fillStyle = '#fff';
    ctx.font = '800 14px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + score, 8, 20);
    ctx.fillStyle = '#ffe94a';
    ctx.textAlign = 'right';
    ctx.fillText('BEST ' + best, canvas.width - 8, 20);
    ctx.textAlign = 'left';
  }

  /* ---------------- loop ---------------- */
  let last = performance.now();
  function loop(now) {

    // Some sandboxed/embedded contexts omit the rAF timestamp - fall back safely
    if (typeof now !== 'number' || !isFinite(now)) now = performance.now();
    if (typeof last !== 'number' || !isFinite(last)) last = now;
    const dt = Math.min(250, Math.max(0, now - last));
    last = now;
    if (running && !paused) {
      acc += dt;
      while (acc >= tickMs) { acc -= tickMs; tick(); if (!running) break; }
      // particles update even when paused? keep in draw
      draw();
    } else {
      draw();
    }
    requestAnimationFrame(loop);
  }

  loadBest();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
