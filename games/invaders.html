<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Pixel Invaders &#x2014; shoot the descending alien horde before it lands.">
<title>Pixel Invaders &#x2014; Pixel Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230a0618'/><rect x='2' y='2' width='12' height='12' fill='%23ffb03d'/></svg>">
<link rel="stylesheet" href="../style.css">
<style>
  .stage-wrap { max-width: 480px; margin: 0 auto; }
</style>
</head>
<body>
<div class="shell">

  <div class="top-bar">
    <a class="exit-arrow" href="../index.html" title="Back to all games">&#x2190;</a>
    <h1 class="game-title">PIXEL INVADERS</h1>
    <button class="mute-btn" id="muteBtn">SOUND: ON</button>
  </div>

  <div class="stage-wrap">
    <canvas id="game" width="480" height="480"></canvas>

    <div id="startOverlay" class="overlay">
      <h2>PIXEL INVADERS</h2>
      <p class="ov-sub">HOW TO PLAY: &#x2190;&#x2192; MOVE &#x00B7; SPACE SHOOT</p>
      <button class="btn" id="startBtn">START</button>
      <p class="ov-sub" style="font-size:11px">HOW TO WIN: CLEAR ALL ENEMIES - DON'T LET THEM LAND</p>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
      <h2>PAUSED</h2>
      <p class="ov-sub">press P to resume</p>
    </div>

    <div id="overOverlay" class="overlay hidden">
      <h2 id="endTitle">GAME OVER</h2>
      <p class="ov-sub" id="finalScore">SCORE 0 &#x00B7; BEST 0</p>
      <button class="btn" id="restartBtn">PLAY AGAIN</button>
      <p class="ov-sub" style="font-size:11px">or press ENTER</p>
    </div>
  </div>

  <p class="controls-hint">&#x2190;&#x2192; MOVE &#x00B7; SPACE SHOOT &#x00B7; P PAUSE &#x00B7; M SOUND</p>
</div>

<script src="../points.js"></script>
<script>/* ============================================================
   PIXEL INVADERS - shoot the descending horde (vanilla canvas)
   ============================================================ */
(function () {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const COLS = 8, ROWS = 5, EW = 30, EH = 20, GAP = 8;
  const PW = 40, PH = 14, PY = H - 32;
  const P_SPEED = 280, B_SPEED = 430, BOMB_SPEED = 210;
  const WAVE_TARGET = 3;

  /* ---------------- audio (tiny WebAudio synth) ---------------- */
  let actx = null, muted = false;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(f0, f1, dur, type, vol, delay) {
    if (muted) return;
    const ac = ensureAudio(); if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(vol || 0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const sfx = {
    shot:  () => tone(520, 240, 0.08, 'square', 0.06),
    hit:   () => { tone(300, 120, 0.1, 'sawtooth', 0.1); tone(150, 60, 0.12, 'square', 0.08, 0.03); },
    boom:  () => { tone(220, 60, 0.25, 'sawtooth', 0.14); tone(120, 40, 0.2, 'square', 0.1, 0.04); },
    wave:  () => [440, 660, 880].forEach((f, i) => tone(f, f, 0.12, 'square', 0.09, i * 0.1)),
    win:   () => [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.14, 'square', 0.1, i * 0.14)),
    lose:  () => [400, 300, 200, 140].forEach((f, i) => tone(f, f, 0.16, 'sawtooth', 0.09, i * 0.16))
  };

  /* ---------------- state ---------------- */
  let fx, fy, dir, enemies, bullets, bombs, parts, px, lives, score, wave, bombT, shotT;
  let over, t = 0, last, started, paused;
  let best = Number(localStorage.getItem('pixel-game-invaders-best') || 0);

  function spawnWave() {
    fx = 40; fy = 64; dir = 1;
    enemies = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) enemies.push({ r, c, alive: true });
    bullets = []; bombs = [];
    bombT = 1; shotT = 0;
  }

  function init() {
    wave = 1; lives = 3; score = 0; over = false;
    px = W / 2;
    parts = [];
    spawnWave();
  }

  function spawnParts(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      parts.push({ x, y, vx: (Math.random() - 0.5) * 300, vy: -Math.random() * 260 - 40, life: 0.4, color });
    }
  }

  function endGame(won) {
    over = true; window.PGPoints && PGPoints.afterGame();
    document.getElementById('endTitle').textContent = won ? 'YOU WIN!' : 'GAME OVER';
    document.getElementById('finalScore').textContent = 'SCORE ' + score + '  BEST ' + best;
    document.getElementById('overOverlay').classList.remove('hidden');
    if (won) sfx.win(); else sfx.lose();
  }

  /* ---------------- input ---------------- */
  const keys = {};
  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
    if (e.repeat) return;
    keys[k] = true;
    if (k === 'p') togglePause();
    if (k === 'm') toggleMute();
    if (k === 'enter' && !started) startGame();
    if (k === 'enter' && over) rematch();
  });
  document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  function toggleMute() {
    muted = !muted;
    document.getElementById('muteBtn').textContent = muted ? 'SOUND: OFF' : 'SOUND: ON';
  }
  function togglePause() {
    if (!started || over) return;
    paused = !paused;
    document.getElementById('pauseOverlay').classList.toggle('hidden', !paused);
  }
  function startGame() {
    if (started) return;
    started = true;
    init();
    document.getElementById('startOverlay').classList.add('hidden');
    sfx.wave();
  }
  function rematch() {
    document.getElementById('overOverlay').classList.add('hidden');
    init();
    started = true;
  }
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', rematch);
  document.getElementById('muteBtn').addEventListener('click', toggleMute);

  /* ---------------- update ---------------- */
  function update(dt) {
    // formation movement
    const alive = enemies.filter(e => e.alive);
    const speed = 46 + wave * 26 + (COLS * ROWS - alive.length) * 2.4;
    fx += dir * speed * dt;
    let edge = false;
    for (let i = 0; i < alive.length; i++) {
      const ex = fx + alive[i].c * (EW + GAP);
      if (ex < 4) { dir = 1; edge = true; }
      if (ex + EW > W - 4) { dir = -1; edge = true; }
    }
    if (edge) fy += 16;
    // reached the player line?
    for (let i = 0; i < alive.length; i++) {
      if (fy + alive[i].r * (EH + GAP) + EH >= PY - 6) { endGame(false); return; }
    }

    // player movement + shooting
    let mv = 0;
    if (keys.arrowleft || keys.a) mv -= 1;
    if (keys.arrowright || keys.d) mv += 1;
    px += mv * P_SPEED * dt;
    px = Math.max(PW / 2, Math.min(W - PW / 2, px));
    shotT -= dt;
    if (keys[' '] && shotT <= 0 && bullets.length < 3) {
      bullets.push({ x: px, y: PY - PH / 2 });
      shotT = 0.28;
      sfx.shot();
    }

    // bullets vs enemies
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.y -= B_SPEED * dt;
      if (b.y < -10) { bullets.splice(i, 1); continue; }
      for (let j = 0; j < alive.length; j++) {
        const e = alive[j];
        const ex = fx + e.c * (EW + GAP) + EW / 2;
        const ey = fy + e.r * (EH + GAP) + EH / 2;
        if (Math.abs(b.x - ex) < EW / 2 + 3 && Math.abs(b.y - ey) < EH / 2 + 3) {
          e.alive = false;
          bullets.splice(i, 1);
          score += e.r >= 4 ? 10 : e.r >= 2 ? 20 : 30;
          if (score > best) { best = score; localStorage.setItem('pixel-game-invaders-best', String(best)); }
          spawnParts(ex, ey, 8, '#ffb03d');
          sfx.hit();
          break;
        }
      }
    }

    // enemy bombs
    bombT -= dt;
    if (bombT <= 0 && alive.length) {
      bombT = Math.max(0.35, 0.85 - wave * 0.08 - Math.random() * 0.3);
      const e = alive[Math.floor(Math.random() * alive.length)];
      bombs.push({ x: fx + e.c * (EW + GAP) + EW / 2, y: fy + e.r * (EH + GAP) + EH });
    }
    for (let i = bombs.length - 1; i >= 0; i--) {
      const b = bombs[i];
      b.y += BOMB_SPEED * dt;
      if (b.y > H + 10) { bombs.splice(i, 1); continue; }
      if (Math.abs(b.x - px) < PW / 2 + 3 && Math.abs(b.y - (PY - PH / 2)) < PH / 2 + 5) {
        bombs.splice(i, 1);
        lives--;
        spawnParts(px, PY - PH / 2, 14, '#ff4d6d');
        sfx.boom();
        if (lives <= 0) { endGame(false); return; }
      }
    }

    // wave cleared?
    if (!enemies.some(e => e.alive)) {
      wave++;
      if (wave > WAVE_TARGET) { endGame(true); return; }
      sfx.wave();
      spawnWave();
    }
  }  /* ---------------- drawing ---------------- */
  function draw() {
    ctx.fillStyle = '#0a0618';
    ctx.fillRect(0, 0, W, H);
    // stars
    for (let i = 0; i < 40; i++) {
      const sx = (i * 137.5) % W, sy = (i * 71.3) % H;
      ctx.globalAlpha = 0.2 + 0.6 * Math.abs(Math.sin(t * 1.5 + i));
      ctx.fillStyle = '#fff';
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;
    // enemies
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      const ex = fx + e.c * (EW + GAP), ey = fy + e.r * (EH + GAP);
      const col = e.r < 2 ? '#ff7ab8' : e.r < 4 ? '#b96bff' : '#4de3ff';
      const legs = Math.sin(t * 10 + i) > 0;
      ctx.fillStyle = col;
      ctx.fillRect(ex + 6, ey + (legs ? 12 : 8), 6, 6);
      ctx.fillRect(ex + 18, ey + (legs ? 12 : 8), 6, 6);
      ctx.fillRect(ex + 4, ey + 4, 22, 10);
      ctx.fillStyle = '#0a0618';
      ctx.fillRect(ex + 8, ey + 7, 4, 4);
      ctx.fillRect(ex + 18, ey + 7, 4, 4);
    }
    // player ship
    ctx.fillStyle = '#39ff14';
    ctx.fillRect(px - PW / 2, PY - PH / 2, PW, PH);
    ctx.fillStyle = '#0a0618';
    ctx.fillRect(px - 6, PY - PH / 2 + 4, 4, 6);
    ctx.fillRect(px + 2, PY - PH / 2 + 4, 4, 6);
    // bullets + bombs
    ctx.fillStyle = '#ffe94a';
    for (let i = 0; i < bullets.length; i++) ctx.fillRect(bullets[i].x - 2, bullets[i].y - 6, 4, 10);
    ctx.fillStyle = '#ff4d6d';
    for (let i = 0; i < bombs.length; i++) ctx.fillRect(bombs[i].x - 3, bombs[i].y - 5, 6, 10);
    // particles
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      p.life -= 1 / 60; p.x += p.vx / 60; p.y += p.vy / 60;
      ctx.globalAlpha = Math.max(0, p.life / 0.4);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = '800 14px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + score, 10, 26);
    ctx.textAlign = 'center';
    ctx.fillText('WAVE ' + wave + '/' + WAVE_TARGET, W / 2, 26);
    ctx.textAlign = 'right';
    ctx.fillText('BEST ' + best, W - 10, 26);
    for (let i = 0; i < lives; i++) {
      ctx.fillStyle = '#39ff14';
      ctx.fillRect(10 + i * 22, H - 20, 16, 6);
    }
  }

  /* ---------------- main loop ---------------- */
  function loop(now) {
    if (typeof now !== 'number' || !isFinite(now)) now = performance.now();
    if (typeof last !== 'number' || !isFinite(last)) last = now;
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    t += dt;
    if (started && !paused && !over) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  init();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
